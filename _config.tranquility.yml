slogan: "风物长宜放眼量"
email: ox0pine@gmail.com
logo: "/images/logo.svg"

mathjax: true # 加载 LateX 数学公式库

favicon: # 配置网页图标
  small: /images/favicon-16x16.png
  medium: /images/favicon-32x32.png
  apple_touch_icon: /images/apple-touch-icon.png
  safari_pinned_tab: /images/logo.svg

subpage: # 开启"子页"功能，详见 README
  enable: true
  pages:
    - name: tech # 文章的分类（category）名
      path: tech # 若不设置则默认使用 name
      title: 技术杂谈 # 菜单名
      icon: /images/icon/icon-code.svg # 图标的路径
      description: 技术分享、编程心得、开发经验 # 描述
    - name: life # 文章的分类（category）名
      path: life # 若不设置则默认使用 name
      title: 生活随笔 # 菜单名
      icon: /images/icon/icon-book.svg # 图标的路径
      description: 生活感悟、日常记录、随笔杂谈 # 描述
    - name: app # 作品集：每篇文章介绍一个自己开发的项目
      path: apps
      title: 作品集
      icon: /images/icon/icon-app.svg
      description: 最近开发的项目，一个项目一篇记录
    # 非文章分类的子页：不聚合文章，而是渲染 X（Twitter）动态。
    # 内容来自 source/_data/twitter.json，由 .github/workflows/twitter.yml 每天抓取提交。
    - name: moments
      path: moments
      title: 动态随笔
      icon: /images/icon/icon-twitter.svg
      description: 同步自 X 的碎片化动态
      type: twitter
      twitter:
        username: ox0pine
        limit: 20 # 最多展示最近多少条，抓取脚本的 TWITTER_LIMIT 决定入库条数

index: # 配置首页个性化内容
  motto: "记录生活，分享美好"
  poem:
    - 秋风飘起黄叶落
    - 岁月静好心安然
  # 关于区只放文字，不再配照片；`text` 的每一项渲染成一个段落。
  about:
    title: 关于我
    text:
      - 你好，我是 ox0pine——一个在实验室和服务器之间来回切换的人：白天读论文、调模型，晚上写代码、折腾站点。
      - 着迷于「把想法做成能跑的东西」：大模型应用、全栈开发、自动化脚本，以及一切能替我干掉重复劳动的工程。踩过的坑大多写进了技术杂谈，从网络部署、CI 流程到工具链配置。
      - 另一半交给生活随笔：周记与年度总结，记录读书、比赛、失眠和顿悟，也记录那些没什么用、但很快乐的瞬间。
      - 这个博客中途换过 Hugo 和 WordPress，最后又绕回 Hexo。「风物长宜放眼量」是给自己的提醒，也是这里的态度。

foot:
  title:
    - "秋风飘起黄叶落"
    - "岁月静好心安然"
  linksRows: 4

links: # 朋友
  - name: "My GitHub"
