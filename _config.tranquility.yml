# 未启用的第三方集成（gitalk 评论、赞赏、相关推荐、百度统计/验证、
# Google AdSense、Algolia 搜索）连同其模板与样式一并删除，不再保留占位字段。

# 自定义字体，用于美化部分汉字的显示效果.
# 可以通过替换 _font/ 目录下的字体文件替换自己喜欢的字体
zh_font:
  enable: true
  fontName: LXGWWenKai
  type: ttf
  style:
    - normal
    - bold

# 配置时间线 参考 README.md
timeline:
  enable: true
  order: false # 是否按时间正序展示，false 为倒序
  limit: 8 # 首页时间线最多显示多少条，其余进 /timeline/；设为 0 表示不限
  items:
    - name: article
      color: "#ee936c"
      icon: /images/icon/icon-article.svg
      checked: true
    - name: app
      color: "#60a465"
      icon: /images/icon/icon-app.svg
      checked: true
    - name: event
      color: "#568dc4"
      icon: /images/icon/icon-event.svg
      checked: true

# 标签云
tagcloud:
  fancy: false
  min_font: 14
  max_font: 30

mermaid:
  enable: true # 启用 Mermaid 增强
  version: latest
  options:
    startOnload: true

cv:
  enable: false
  showInNav: false
  iconPrefix: fas
  keywords: 简历,ox0pine,个人简历,技术博客,秋风飘起黄叶落,田博松
  description: ox0pine的个人简历，记录博客作者的教育背景、代表作品、工作经验和荣誉奖项。
  title: 秋风飘起黄叶落的个人简历
  content:
    title: ox0pine
    baseInfo:
      - 28届应届硕士
      - 大模型应用开发
      - 前后端全栈开发
    email: ox0pine@gmail.com
    github: ox0pine
    blog: 秋风飘起黄叶落のblog
    blogHref: https://ox0pine.github.io
    edu:
      title: "教育背景"
      content:
        - 2021年 - 2025年，本科，电子科学与技术，燕山大学
        - 2025年至今，硕士，电子科学与技术，西安电子科技大学
    chapters:
      - title: "代表作品"
        icon: fa-briefcase
        tips: 请点击项目名称查看项目详情
        sections:
          - title: CodeRunner
            link: https://github.com/ox0pine/CodeRunner
            description: 远程代码执行平台
            content:
              - 基于 FastAPI + React 18 构建的现代化代码执行平台，采用 JWT + Argon2 安全认证和四级用户权限体系。核心技术栈包括 FastAPI 异步框架、Ant Design UI 组件库、Docker 容器化部署和 Conda 环境管理。实现了安全沙箱代码执行、AI 智能代码生成（支持多种 AI 模型）、个人代码库管理和社区交互系统，具备完整的用户管理、日志审计和资源配限功能。项目采用单体架构设计，支持高并发处理和多租户隔离，展现了全栈开发和系统架构设计的综合能力。
          - title: WebMonitor
            link: https://github.com/webmonitor/WebMonitor
            description: 智能网页内容监控与多渠道通知平台
            content:
              - 基于 FastAPI + React 18 构建的现代化网页内容监控平台，采用 JWT + bcrypt安全认证和基于角色的用户权限体系（管理员/普通用户）。核心技术栈包括 Selenium WebDriver 动态内容抓取、APScheduler任务调度、Material-UI 组件库和 SQLAlchemy ORM 数据持久化。实现了精准的 XPath选择器内容提取、智能变更检测算法、多邮件配置 SMTP 通知系统和任务订阅分享机制，具备完整的用户管理、监控日志审计、域名黑名单过滤和实时任务监控功能。项目采用前后端分离架构设计，支持 SQLite/PostgreSQL 数据库切换、无头 Chrome浏览器自动化和高并发任务处理，展现了全栈开发、Web自动化爬虫技术和系统架构设计的综合能力。

      # - title: 工作经验
      #   icon: fa-laptop-code
      #   sections:
      #     - title: 大唐翰林供奉
      #       description: 743 - 744
      #       content:
      #         - 赐宫锦袍。暮春，兴庆池牡丹盛开，玄宗与杨玉环同赏，李白又奉诏作《清平调》。对御用文人生活日渐厌倦，始纵酒以自昏秽。
      #         - 与贺知章等人结“酒中八仙”之游，玄宗呼之不朝。尝奉诏醉中起草诏书，引足令高力士脱靴，宫中人恨之，谗谤于玄宗，玄宗疏之，后玄宗赐金放还。
      - title: 荣誉奖项
        icon: fa-trophy
        list: true
        content:
          - 河北省优秀毕业生
          - 第21届全国大学生信息安全与对抗技术竞赛国家级二等奖
          - 第22届中国研究生数学建模竞赛国家三等奖
          - 第14届全国大学生数学建模竞赛省级一等奖
      - title: 技能特长
        icon: fa-star
        content:
          - 大模型应用开发：熟练掌握OpenAI GPT、Claude、文心一言等主流大模型API集成与开发，具备Prompt优化设计、Function Calling、向量数据库检索增强生成(RAG)和Agent智能体开发经验。
          - 前后端全栈开发：精通FastAPI异步后端框架、React 18前端开发，熟悉Vue、NextJS等现代框架，掌握RESTful API设计和WebSocket实时通信技术。
          - 数据库与数据工程：熟悉MySQL、PostgreSQL关系型数据库，掌握MongoDB、Redis等NoSQL数据库，具备数据清洗、处理和可视化分析能力。
          - 自动化与工具开发：熟练使用n8n、Playwright等自动化工具进行工作流设计和二次开发，具备CI/CD流水线搭建和DevOps实践经验。
          - 容器化与部署：精通Docker容器化技术和Kubernetes编排，熟悉云服务(AWS、阿里云)部署和微服务架构设计。
          - AI工程化能力：具备模型训练优化、API服务封装、性能监控和大规模并发处理经验，熟悉LangChain、LlamaIndex等AI开发框架。

