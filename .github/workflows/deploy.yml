name: Build and Deploy Hexo

on:
  push:
    branches: [main]
  # Commits pushed with the default GITHUB_TOKEN never trigger other workflows,
  # so the daily twitter update cannot chain through `push`. Chaining through
  # `workflow_run` works: that event fires on completion of the updater itself.
  workflow_run:
    workflows: ["Update X timeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Always build the branch head: on `workflow_run` the payload points at
          # the updater's own commit, which may predate the snapshot it pushed.
          ref: main
          # scripts/git-updated.js needs the real history to resolve each post's
          # last commit; the default shallow clone would fall back to publish dates.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 20 is EOL; setup-node v6+ also enables caching for npm only,
          # so pnpm needs an explicit cache input.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          enable_jekyll: false
